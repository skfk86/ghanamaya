name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_FILE: ${{ github.workspace }}/../ghanamaya.keystore
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_ALIAS: ghanamaya
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check required files
        run: |
          test -f google-services.json || { echo "::error::google-services.json مفقود: نزّله من Firebase وضعه في جذر المستودع"; exit 1; }
          test -n "$KS_PASS" || { echo "::error::السر KEYSTORE_PASSWORD غير مضبوط"; exit 1; }
          test -n "$KS_B64" || { echo "::error::السر KEYSTORE_BASE64 غير مضبوط"; exit 1; }
          echo "$KS_B64" | base64 -d > "$KS_FILE"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # تفعيل مزوّد Google في إضافة @capacitor-firebase/authentication
      - name: Enable Google provider
        run: sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle

      - name: Add google-services.json
        run: cp google-services.json android/app/google-services.json

      # رقم إصدار يزيد تلقائياً مع كل بناء (مطلوب لـ Google Play)
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      # التوقيع تلقائياً بالمفتاح الثابت (نفس البصمة في كل بناء)
      - name: Build signed APK and AAB
        working-directory: android
        run: |
          SIGN="-Pandroid.injected.signing.store.file=$KS_FILE \
                -Pandroid.injected.signing.store.password=$KS_PASS \
                -Pandroid.injected.signing.key.alias=$KS_ALIAS \
                -Pandroid.injected.signing.key.password=$KS_PASS"
          ./gradlew assembleRelease bundleRelease $SIGN --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: ghanamaya-apk
          path: android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ghanamaya-aab-for-play
          path: android/app/build/outputs/bundle/release/*.aab
